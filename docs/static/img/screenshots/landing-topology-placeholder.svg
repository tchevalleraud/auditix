<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Live topology placeholder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <g fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2">
    <line x1="500" y1="280" x2="640" y2="220"/>
    <line x1="780" y1="280" x2="640" y2="220"/>
    <line x1="500" y1="280" x2="780" y2="280"/>
    <line x1="500" y1="280" x2="560" y2="380"/>
    <line x1="780" y1="280" x2="720" y2="380"/>
  </g>
  <g fill="white">
    <circle cx="640" cy="220" r="18"/>
    <circle cx="500" cy="280" r="14"/>
    <circle cx="780" cy="280" r="14"/>
    <circle cx="560" cy="380" r="12"/>
    <circle cx="720" cy="380" r="12"/>
  </g>
  <text x="640" y="510" text-anchor="middle" font-size="52" font-family="Inter, system-ui, sans-serif" font-weight="700" fill="white">Live Topology</text>
  <text x="640" y="560" text-anchor="middle" font-size="22" font-family="Inter, system-ui, sans-serif" fill="rgba(255,255,255,0.75)">Screenshot coming soon</text>
</svg>
