<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="PDF and mail reports placeholder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <g stroke="white" stroke-width="3" stroke-linejoin="round">
    <path d="M 560 170 L 660 170 L 720 230 L 720 430 L 560 430 Z" fill="rgba(255,255,255,0.1)" stroke-opacity="0.9"/>
    <path d="M 660 170 L 660 230 L 720 230" fill="none" stroke-opacity="0.9"/>
  </g>
  <g stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7">
    <line x1="585" y1="270" x2="695" y2="270"/>
    <line x1="585" y1="300" x2="675" y2="300"/>
    <line x1="585" y1="330" x2="685" y2="330"/>
  </g>
  <g fill="white" fill-opacity="0.85">
    <rect x="585" y="365" width="14" height="45"/>
    <rect x="608" y="385" width="14" height="25"/>
    <rect x="631" y="375" width="14" height="35"/>
    <rect x="654" y="350" width="14" height="60"/>
    <rect x="677" y="370" width="14" height="40"/>
  </g>
  <text x="640" y="510" text-anchor="middle" font-size="52" font-family="Inter, system-ui, sans-serif" font-weight="700" fill="white">PDF &amp; Mail Reports</text>
  <text x="640" y="560" text-anchor="middle" font-size="22" font-family="Inter, system-ui, sans-serif" fill="rgba(255,255,255,0.75)">Screenshot coming soon</text>
