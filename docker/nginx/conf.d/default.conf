server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;

    access_log /var/log/nginx/access.real.log;
    error_log /var/log/nginx/error.real.log;

    error_page 502 /502.html;
    location = /502.html {
        root /etc/nginx/html;
        internal;
    }

    location /api {
        root /var/www/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/public;
        # Use a variable so nginx re-resolves php's IP via the docker resolver.
        # A static upstream {} block caches the IP at boot, breaking after any php restart.
        set $upstream_php php:9000;
        fastcgi_pass $upstream_php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        # Forward client IP info so Symfony (with trusted_proxies) resolves the real IP.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location /.well-known/mercure {
        # Use host:port without path so nginx forwards the original URI + query string
        set $upstream_mercure mercure:80;
        proxy_pass http://$upstream_mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    location / {
        set $upstream_node node:3000;
        proxy_pass http://$upstream_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/webpack-hmr {
        set $upstream_node_hmr node:3000;
        proxy_pass http://$upstream_node_hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
