server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1024M;

    access_log /var/log/nginx/access.real.log;
    error_log /var/log/nginx/error.real.log;

    error_page 502 /502.html;
    location = /502.html {
        root /etc/nginx/html;
        internal;
    }

    location /api {
        root /var/www/public;
        try_files $uri /index.php$is_args$args;
    }

    include /etc/nginx/conf.d/fastcgi-php.inc;

    location /.well-known/mercure {
        # Use host:port without path so nginx forwards the original URI + query string
        set $upstream_mercure mercure:80;
        proxy_pass http://$upstream_mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    location / {
        set $upstream_node node:3000;
        proxy_pass http://$upstream_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/webpack-hmr {
        set $upstream_node_hmr node:3000;
        proxy_pass http://$upstream_node_hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# Internal-only API endpoint for inter-container calls (Next.js middleware,
# server components). Not published in docker-compose.yml, so unreachable
# from outside the Docker network. Stays plain HTTP regardless of any
# HTTPS redirect that may be applied to the public :80 server block.
server {
    listen 8080;
    server_name nginx;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 1024M;

    access_log /var/log/nginx/access.real.log;
    error_log /var/log/nginx/error.real.log;

    location /api {
        root /var/www/public;
        try_files $uri /index.php$is_args$args;
    }

    include /etc/nginx/conf.d/fastcgi-php.inc;
}
